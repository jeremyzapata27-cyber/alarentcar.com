<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent a Car | Alquiler de Vehículos</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; text-align: center; background-color: #f4f4f4; }
        header { background-color: #1a1a1a; color: white; padding: 20px; }
        .hero { padding: 50px 20px; background-color: #e6e6e6; }
        .btn-whatsapp { background-color: #25d366; color: white; padding: 15px 30px; text-decoration: none; font-weight: bold; border-radius: 5px; display: inline-block; margin-top: 20px; }
        .grid { display: flex; justify-content: center; gap: 20px; padding: 40px; flex-wrap: wrap; }
        .car-card { background: white; border: 1px solid #ddd; padding: 20px; border-radius: 8px; width: 250px; box-shadow: 2px 2px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <header>
        <h1>Mi Rent a Car</h1>
        <p>El auto ideal para tu viaje</p>
    </header>

    <section class="hero">
        <h2>Reserva tu vehículo hoy mismo</h2>
        <p>Alquileres rápidos, seguros y económicos sin complicaciones.</p>
        <!-- Reemplaza el número de teléfono abajo con el tuyo (incluyendo código de país) -->
        <a href="https://wa.me" class="btn-whatsapp" target="_blank">Reservar por WhatsApp</a>
    </section>

    <section class="grid">
        <div class="car-card">
            <h3>Auto Económico</h3>
            <p>Ideal para la ciudad.</p>
            <strong>Desde $30/día</strong>
        </div>
        <div class="car-card">
            <h3>SUV Familiar</h3>
            <p>Espacio y comodidad.</p>
            <strong>Desde $55/día</strong>
        </div>
    </section>

</body>
</html>
